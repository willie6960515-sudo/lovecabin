*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.55}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #a85d38;outline-offset:3px}
[hidden]{display:none!important}
.shell{max-width:1080px;margin:auto;padding:0 32px 104px}
header{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--serif);font-weight:800;font-size:22px}
.mark{display:grid;place-items:center;width:39px;height:39px;border-radius:50%;background:var(--green);color:white;font-family:system-ui;font-size:22px}
.status{padding:8px 13px;border:1px solid var(--line);border-radius:100px;background:var(--white);color:var(--green);font-size:13px;min-height:40px}
.hero{min-height:240px;display:grid;align-content:center;position:relative;overflow:hidden;border-radius:22px;padding:32px 38px;color:#fffaf2;background:#493226}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(90deg,#211710b8,#2b1e1560 55%,#2b1e1520),var(--hero-art,radial-gradient(ellipse at 85% 60%,#98755b,#483123 64%));background-position:center;background-size:cover}
.hero>*{position:relative;margin:0}
.hero p:first-child{color:#f3d3ae;font-size:14px;letter-spacing:.1em}
.hero h1{font-family:var(--serif);font-size:clamp(32px,5vw,51px);line-height:1.2;margin:12px 0;font-weight:800}
.hero p:last-child{font-size:15px}
section{margin:26px 0}
.section-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
h2,h3,p{margin:0}
h2{font-family:var(--serif);font-size:26px;line-height:1.25}
h3{font-size:17px}
.minor,.quiet{font-size:14px;color:var(--muted)}
.muted{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.topic{border:1px solid #e9d8bf;border-radius:17px;background:#f5e9d6;min-height:149px;text-align:left;padding:15px 17px;display:grid;grid-template-rows:auto 1fr auto;gap:7px}
.topic:nth-child(2){background:#e8ece2;border-color:#d8e1d4}
.topic:nth-child(3){background:#f4e3db;border-color:#eddbd0}
.topic:hover,.tile:hover,.status:hover,.btn:not(.primary):hover{filter:brightness(.97)}
.tag{font-size:12px;font-weight:700;color:var(--green);letter-spacing:.06em}
.topic strong{font-family:var(--serif);font-size:18px;line-height:1.45}
.topic .arrow{justify-self:end;color:var(--green);line-height:1;font-size:21px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--white);border-radius:15px;padding:14px;text-align:left;display:flex;align-items:center;gap:10px;min-height:60px;font-size:14px;font-weight:700}
.symbol{width:34px;height:34px;flex:0 0 34px;border-radius:12px;display:grid;place-items:center;background:#edeadf;color:var(--green);font-size:17px}
.panel,.item{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--white);min-width:0;overflow-wrap:anywhere}
.stack{display:grid;gap:10px}
.item .minor{margin-bottom:5px}
.body-text{white-space:pre-wrap;margin-top:7px}
.item-photo{display:block;width:100%;max-height:320px;object-fit:contain;border-radius:10px;margin-bottom:10px;background:#efe9dc}
.item-actions,.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);border-radius:10px;background:var(--white);padding:8px 13px;min-height:42px}
.btn.primary{background:var(--green);border-color:var(--green);color:white}
.btn.link{background:transparent;border-color:transparent;color:var(--green);font-size:14px}
.btn.danger{color:#933b29}
.btn:disabled{opacity:.55;cursor:wait}
.view-title{margin:14px 0 20px}
.view-title h1{font:800 clamp(32px,5vw,45px)/1.2 var(--serif);margin:0 0 8px}
nav{position:fixed;z-index:3;bottom:0;left:0;right:0;background:#fffdf8f5;border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}
.nav-inner{margin:auto;display:grid;grid-template-columns:repeat(6,1fr);max-width:690px;gap:4px}
nav button{border:0;background:transparent;border-radius:12px;min-height:52px;display:grid;justify-items:center;align-content:center;line-height:1.3;font-size:13px;color:var(--muted)}
nav button span{font-size:20px}
nav button[aria-current=page]{background:#e9ede3;color:var(--green);font-weight:800}

function readDemo(){
  try{
    const stored=localStorage.getItem(demoKey);
    if(!stored) return seedDemo();
    const parsed=JSON.parse(stored);
    if(parsed.version===1 && Array.isArray(parsed.shared) && Array.isArray(parsed.private?.first) && Array.isArray(parsed.private?.second)) return parsed;
  }catch(error){
    console.warn("讀取試用資料失敗",error);

function demoChange(scope,id,patch){
  const next=structuredClone(demoData);
  const list=scope==="private"?next.private[accountId]:next.shared;
  const index=list.findIndex(row=>row.id===id);
  if(patch && index<0) list.push({id,...patch});
  else if(patch) list[index]={...list[index],...patch};
  else if(index>=0) list.splice(index,1);
  try{localStorage.setItem(demoKey,JSON.stringify(next));}
  catch(error){throw Error("瀏覽器目前無法儲存試用資料。可先匯出備份，或移除較大的照片後再試。");}
  demoData=next;
  demoSync();
}
const demoStore={
  change:async(scope,id,patch)=>demoChange(scope,id,patch),

}

function wireForm(element,submit){
  element.addEventListener("submit",async event=>{
    event.preventDefault();
    const trigger=element.querySelector("[type=submit]");
    if(trigger.disabled) return;
    trigger.disabled=true;
    const error=element.querySelector(".error");
    error.textContent="";
    try{await submit(new FormData(element));}
    catch(failure){error.textContent=explain(failure);}
    finally{trigger.disabled=false;}
  });
}
function explain(error){
  const messages={
    "permission-denied":"目前的帳號無法操作這筆資料，請確認配對狀態及資料庫規則。",
    "auth/invalid-credential":"電子郵件或密碼有誤。",

    "auth/email-already-in-use":"這個電子郵件已註冊，請改用登入。",
    "auth/weak-password":"請使用至少 8 個字元的密碼。",
    "auth/network-request-failed":"無法連上登入服務，請確認網路。",
    "auth/too-many-requests":"嘗試次數過多，請稍後再試。"
  };
  return messages[error?.code] || (error?.code?"操作失敗，請確認網路與小屋設定後再試。":error?.message) || "操作失敗，請再試一次。";
}

function ledger(){

  const members = people();
  const choices = availableCategories();
  const byCategory = new Map();

  for(const row of period){

    const payerId = expensePayer(row,members)?.id || "";
    total += amount;
    byCategory.set(category,(byCategory.get(category)||0)+amount);
    byPayer.set(payerId,(byPayer.get(payerId)||0)+amount);

async function saveCategory(raw){
  const label = raw.trim();
  if(!label || label.length>24) throw Error("請輸入 1 到 24 個字的分類名稱。");
  if(label===uncategorized) throw Error("請為這個分類取一個新名稱。");
  if(!availableCategories().includes(label)) await create("shared","expenseCat",{title:label});
  return label;
}
function categoryChoice(label,selected){
  return `<label class="category-choice"><input type="radio" name="category" value="${escape(label)}" ${selected?"checked":""} required><span>${escape(label)}</span></label>`;
}
function wireCategoryInput(){
  const editor = content.querySelector(".add-category");
  const input = editor.querySelector("input");
  const add = editor.querySelector("button");
  const error = editor.querySelector(".category-error");
  const group = content.querySelector(".category-choices");
  add.addEventListener("click",async ()=>{
    add.disabled=true;
    error.textContent="";
    try{
      const label = await saveCategory(input.value);
      let option = [...group.querySelectorAll("input")].find(radio=>radio.value===label);
      if(!option){
        group.insertAdjacentHTML("beforeend",categoryChoice(label,false));
        option = group.lastElementChild.querySelector("input");
      }
      option.checked=true;
      option.focus();
      input.value="";
      editor.open=false;
      tell("已選用「"+label+"」。");
    }catch(failure){error.textContent=explain(failure);}
    finally{add.disabled=false;}
  });
  input.addEventListener("keydown",event=>{
    if(event.key==="Enter" && !event.isComposing){
      event.preventDefault();
      add.click();
    }
  });
}

async function compress(file){
  if(!file?.size) return "";
  if(file.size>20*1024*1024) throw Error("請選擇 20 MB 以內的照片。");
  const url=URL.createObjectURL(file);
  try{
    const image=new Image();
    image.src=url;
    await image.decode();
    const canvas=document.createElement("canvas");
    const ctx=canvas.getContext("2d");
    for(const size of [1000,780,570,400]){
      const scale=Math.min(1,size/Math.max(image.width,image.height));
      canvas.width=Math.max(1,Math.round(image.width*scale));
      canvas.height=Math.max(1,Math.round(image.height*scale));
      ctx.fillStyle="#fff";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(image,0,0,canvas.width,canvas.height);
      const encoded=canvas.toDataURL("image/jpeg",.74);
      if(isPhoto(encoded)) return encoded;
    }
    throw Error("這張照片無法壓縮到適用大小。");
  }catch(error){
    throw Error("無法加入這張照片。請試試 JPG、PNG 或 WebP。");
  }finally{URL.revokeObjectURL(url);}
}

function importDemo(){
  form("匯入試用備份",`<p class="quiet">合併到目前試用身分。相同的項目保留目前資料。</p><label>備份檔<input name="backup" type="file" accept=".json,application/json" required></label>`,"匯入",async data=>{
    const file=data.get("backup");
    if(file.size>8*1024*1024) throw Error("備份檔過大。");
    let backup;
    try{backup=JSON.parse(await file.text());}catch(error){throw Error("這份備份不是有效的 JSON。");}
    const valid=(rows,kinds)=>Array.isArray(rows) && rows.every(row=>row && /^[a-f0-9]{32}$/.test(row.id) &&
      kinds.includes(row.kind) && Object.hasOwn(demoNames,row.author) && Number.isFinite(row.created) &&
      typeof row.date==="string" && /^(?:\d{4}-\d{2}-\d{2})?$/.test(row.date) &&
      ["title","text","name","ref","album","payer","payerId","category","assignee","status"].every(key=>row[key]===undefined || typeof row[key]==="string") &&
      (!row.photo || isPhoto(row.photo)) &&
      (row.kind!=="shuffle" || (Number.isInteger(row.count) && row.count>=1 && row.count<=3)) &&
      (row.kind!=="expenseCat" || (typeof row.title==="string" && row.title.length>=1 && row.title.length<=24)) &&
      (row.kind!=="expense" || (Number.isFinite(row.amount) && row.amount>0)));
    if(backup?.version!==1 || backup.mode!=="demo" || backup.account!==accountId || !valid(backup.shared,sharedKinds) ||
       !valid(backup.personal,privateKinds) || backup.personal.some(row=>row.author!==accountId)) throw Error("請選擇同一個試用身分匯出的備份。");
    const merge=(current,added)=>{
      const records=new Map(current.map(row=>[row.id,row]));
      for(const row of added) if(!records.has(row.id)) records.set(row.id,row);
      return [...records.values()];
    };
    const next=structuredClone(demoData);
    next.shared=merge(next.shared,backup.shared);
    next.private[accountId]=merge(next.private[accountId],backup.personal);
    if(backup.game && !validGame(backup.game)) throw Error("備份中的任務資料格式有誤。");
    if(!next.game?.revision && backup.game?.revision) next.game=backup.game;
    try{localStorage.setItem(demoKey,JSON.stringify(next));}
    catch(error){throw Error("試用備份超出瀏覽器可儲存的空間。");}
    demoData=next;
    demoSync();
    finish("已匯入試用備份。");
  });
}

async function startCloud(){
  const base="https://www.gstatic.com/firebasejs/13.2.0/";
  const [appModule,authModule,dbModule]=await Promise.all([
    import(base+"firebase-app.js"),import(base+"firebase-auth.js"),import(base+"firebase-firestore.js")
  ]);
  const app=appModule.initializeApp(firebaseConfig);
  const auth=authModule.getAuth(app);
  const db=dbModule.getFirestore(app);
  const {doc,collection,writeBatch,runTransaction,setDoc,updateDoc,deleteDoc,onSnapshot}=dbModule;
  const root="twoHomeV1";
  const userRef=who=>doc(db,root+"Users",who);
  const roomRef=code=>doc(db,root+"Rooms",code);
  const gameRef=code=>doc(roomRef(code),"game","state");
  let unsubscribers=[];
  let unsubRoom=[];
  let roomId="";
  function releaseRoom(){
    for(const unsubscribe of unsubRoom) unsubscribe();
    unsubRoom=[];
  }
  function syncFailure(error){problem=explain(error);loading=false;render();}
  function watchRoom(code){
    if(code===roomId) return;
    releaseRoom();
    roomId=code;
    room=null;
    shared=[];
    gameState=emptyGame();
    if(!code) return;
    let recordsWatching=false;
    unsubRoom.push(onSnapshot(roomRef(code),snapshot=>{
      room=snapshot.exists()?{id:code,...snapshot.data()}:null;
      if(room){
        otherName=(room.owner===accountId?room.partnerName:room.ownerName)||"對方";
        if(room.partner && !recordsWatching){
          recordsWatching=true;
          unsubRoom.push(onSnapshot(collection(roomRef(code),"shared"),result=>{
            shared=result.docs.map(entry=>({id:entry.id,...entry.data()}));render();
          },syncFailure));
          unsubRoom.push(onSnapshot(gameRef(code),result=>{
            const state=result.data();
            if(state && !validGame(state)){syncFailure(Error("任務資料無法讀取，請先保留備份。"));return;}
            if(state && state.revision>=gameState.revision) gameState=state;
            render();
          },syncFailure));
        }
      }
      render();
    },syncFailure));
  }
  store={
    login:(email,password)=>authModule.signInWithEmailAndPassword(auth,email,password),
    register:async(email,password,nickname)=>{
      const {user}=await authModule.createUserWithEmailAndPassword(auth,email,password);
      await authModule.updateProfile(user,{displayName:nickname});
      name=nickname;render();
    },
    reset:email=>authModule.sendPasswordResetEmail(auth,email),
    logout:()=>authModule.signOut(auth),
    change:async(scope,id,patch)=>{
      const ref=scope==="private"?doc(userRef(accountId),"private",id):doc(roomRef(room.id),"shared",id);
      if(!patch) await deleteDoc(ref);
      else if(patch.kind) await setDoc(ref,patch);
      else await updateDoc(ref,patch);
    },
    gameChange:async mutate=>{
      const code=room.id;
      const player=accountId;
      const ref=gameRef(code);
      const saved=await runTransaction(db,async transaction=>{
        const snapshot=await transaction.get(ref);
        const next=applyGame(snapshot.data(),mutate);
        transaction.set(ref,next);
        return next;
      });
      if(room?.id===code && accountId===player && saved.revision>=gameState.revision){gameState=saved;render();}
    },
    createRoom:async()=>{
      const code=uid();
      const ownerName=name;
      const batch=writeBatch(db);
      batch.set(roomRef(code),{owner:accountId,ownerName,partner:"",partnerName:""});
      batch.set(userRef(accountId),{room:code});
      await batch.commit();
      if(room?.id!==code) room={id:code,owner:accountId,ownerName,partner:"",partnerName:""};
    },
    joinRoom:async code=>{
      await runTransaction(db,async transaction=>{
        const existing=await transaction.get(userRef(accountId));
        if(existing.exists()) throw Error("這個帳號已經加入一間小屋。");
        let invite;
        try{invite=await transaction.get(roomRef(code));}
        catch(error){
          if(error.code==="permission-denied") throw Error("這組邀請碼不存在或已用過。");
          throw error;
        }
        if(!invite.exists() || invite.data().partner || invite.data().owner===accountId) throw Error("這組邀請碼無法使用。");
        transaction.update(roomRef(code),{partner:accountId,partnerName:name});
        transaction.set(userRef(accountId),{room:code});
      });
    }
  };
  cloudReady=true;
  authModule.onAuthStateChanged(auth,user=>{
    for(const unsubscribe of unsubscribers) unsubscribe();
    unsubscribers=[];
    releaseRoom();
    roomId="";
    room=null;
    shared=[];
    personal=[];
    gameState=emptyGame();
    problem="";
    tab="home";
    gamePage="draw";
    selectedMonth=today().slice(0,7);
    accountId=user?.uid||"";
    name=user?.displayName||"我";
    otherName="對方";
    loading=false;
    if(user){
      unsubscribers.push(onSnapshot(userRef(user.uid),snapshot=>watchRoom(snapshot.data()?.room||""),syncFailure));
      unsubscribers.push(onSnapshot(collection(userRef(user.uid),"private"),snapshot=>{
        personal=snapshot.docs.map(entry=>({id:entry.id,...entry.data()}));render();
      },syncFailure));
    }
    render();
  },syncFailure);
}

function emptyGame(){

function validGame(value){
  return value && Number.isSafeInteger(value.revision) && value.revision>=0 &&
    value.wallets && typeof value.wallets==="object" && !Array.isArray(value.wallets) &&
    Object.entries(value.wallets).length<=2 && Object.values(value.wallets).every(points=>Number.isSafeInteger(points) && points>=0 && points<=1000000) &&
    gameList(value.drops,30,row=>gameId(row.id) && textFits(row.from,128) && textFits(row.to,128) && validDay(row.day) &&
      taskFields(row) && textFits(row.time,24) && textFits(row.place,24) && textFits(row.budget,24)) &&
    gameList(value.missions,72,row=>gameId(row.id) && textFits(row.owner,128) && textFits(row.partner,128) && validDay(row.day) &&
      taskFields(row) && missionStatuses.includes(row.status) && gameList(row.votes,2,vote=>textFits(vote,128)) &&
      (row.finished===undefined || validDay(row.finished))) &&
    gameList(value.offers,24,row=>gameId(row.id) && textFits(row.owner,128) && textFits(row.title,80) && textFits(row.text,360) &&
      gameCost(row.cost) && typeof row.instant==="boolean") &&
    gameList(value.exchanges,64,row=>gameId(row.id) && textFits(row.owner,128) && textFits(row.buyer,128) &&
      textFits(row.turn,128) && textFits(row.title,80) && textFits(row.text,360) && gameDate(row.day) &&
      exchangeStatuses.includes(row.status) && gameCost(row.cost) && typeof row.wish==="boolean") &&
    gameList(value.history,64,row=>textFits(row.player,128) && textFits(row.title,90) && validDay(row.day) &&
      Number.isSafeInteger(row.delta) && row.delta!==0 && Math.abs(row.delta)<=12);
}
function shiftDay(day,delta){
  const date=new Date(Date.parse(day)+delta*86400000);
  return date.toISOString().slice(0,10);
}
const gameBalance = (state,player) => Object.hasOwn(state.wallets,player)?state.wallets[player]:0;
function applyGame(previous,mutate){
  if(previous && !validGame(previous)) throw Error("任務資料無法讀取，請先保留備份。");
  const state=previous?structuredClone(previous):emptyGame();
  const day=today();
  state.drops=state.drops.filter(row=>row.day>=day);
  state.missions=state.missions.filter(row=>row.day>=shiftDay(day,-30) && !["declined","cancelled"].includes(row.status));
  mutate(state);
  state.history=state.history.slice(-64);
  while(state.exchanges.length>64){
    const old=state.exchanges.findIndex(row=>!["pending","accepted"].includes(row.status));
    if(old<0) throw Error("請先處理一筆未完成的兌換。");
    state.exchanges.splice(old,1);
  }
  state.revision+=1;
  if(!validGame(state)) throw Error("這筆任務資料超出可儲存的範圍。");
  return state;
}

function changePoints(state,player,delta,label,day){

function gameHash(text){
  let hash=2166136261;
  for(const char of text) hash=Math.imul(hash ^ char.codePointAt(0),16777619);
  return hash>>>0;
}
function draws(state,{seed,me,day}){
  const serial=Math.floor(Date.parse(day)/86400000);
  const cards=missionDecks.map(deck=>{
    const sorted=[...deck.cards].sort((a,b)=>gameHash(seed+a[0])-gameHash(seed+b[0]));
    const [title,text,time,place,budget]=sorted[(serial%sorted.length+sorted.length)%sorted.length];
    return {title,text,time,place,budget,label:deck.label,points:deck.points,duo:deck.duo};
  });
  const hidden=state.drops.find(row=>row.to===me && row.day===day);
  if(hidden) cards[1]={...hidden,label:"驚喜卡",custom:true};
  return cards;
}
const taskIsMember = (row,player) => row.owner===player || row.partner===player;
function claimedFor(state,player,day){

async function claimMission(index){
  const id=uid();

  await gameUpdate((state,context)=>{

    if(!card || revealed?.index!==index || revealed.day!==context.day || revealed.title!==card.title) throw Error("題卡已刷新，請再翻開一次。");
    if(claimedFor(state,context.me,context.day)) throw Error("今天已經選過任務了。");
    state.missions.push({id,owner:context.me,partner:card.duo?context.other:"",day:context.day,title:card.title,text:card.text,
      points:card.points,duo:card.duo,status:card.duo?"invited":"active",votes:[]});

async function changeMission(id,action){
  await gameUpdate((state,context)=>{
    const row=find(state.missions,id);
    const {me,day}=context;
    if(!row || !taskIsMember(row,me) || !missionOpen(row,day)) throw Error("這張任務目前已結束。");
    if(row.status==="invited" && row.partner===me && action==="accept"){
      const matchingInvite=state.missions.find(mission=>mission.owner===me && mission.partner===row.owner &&
        mission.status==="invited" && mission.day===row.day && mission.title===row.title);
      if(matchingInvite) matchingInvite.status="cancelled";
      if(claimedFor(state,me,row.day)) throw Error("你今天已選過任務。");
      row.status="active";
    }else if(row.status==="invited" && row.partner===me && action==="decline"){
      row.status="declined";
    }else if(action==="cancel" && !row.votes.length && (row.owner===me || row.status==="active")){
      row.status="cancelled";
    }else if(action==="done" && row.status==="active" && !row.votes.includes(me)){
      row.votes.push(me);
      if(!row.duo || row.votes.length===2){
        row.status="done";
        row.finished=day;
        changePoints(state,row.owner,row.points,row.title,day);
        if(row.duo) changePoints(state,row.partner,row.points,row.title,day);
      }
    }else throw Error("這張任務的狀態已更新。");
  });
  const status=find(gameState.missions,id)?.status;
  if(action==="done") tell(status==="done"?"完成任務，點數已入帳。":"已記下，等對方也確認。");
  else tell(action==="accept"?"已接下雙人任務。":"已更新任務。");
}

  let status={accepted:"已兌換 · 待完成",done:"已完成",declined:"已婉拒",cancelled:"已取消"}[row.status];
  if(row.status==="pending"){
    status=row.turn===accountId?"等你回覆":"等對方回覆";
    if(row.turn===accountId) actions.push(button("確認兌換","game-exchange-accept:"+row.id,"primary"),
      button("改時間或內容","game-counter:"+row.id),button("婉拒","game-exchange-decline:"+row.id));
    else actions.push(button("收回提案","game-exchange-withdraw:"+row.id));
  }
  if(row.status==="accepted"){
    if(row.buyer===accountId) actions.push(button("已完成","game-exchange-done:"+row.id,"primary"));
    actions.push(button(row.day?"改日期":"約日期","game-date:"+row.id),button("取消並退點","game-refund:"+row.id));
  }
  return item(row,`<p class="minor">${row.wish?"願望":"兌換券"} · ${row.cost} 點 · ${status}${row.day?" · "+escape(row.day):""}</p>
    <h3>${escape(row.title)}</h3><p class="minor">${escape(gameMemberName(row.buyer))}兌換 · ${escape(gameMemberName(row.owner))}提供</p>
    ${row.text?`<p class="body-text">${escape(row.text)}</p>`:""}`,actions);
}
function reviewExchange(row){
  form("確認這筆兌換",`<h3>${escape(row.title)}</h3>${row.text?`<p class="quote">${escape(row.text)}</p>`:""}
    <p class="quiet">${row.day?"日期 "+escape(row.day)+" · ":""}確認後會從 ${escape(gameMemberName(row.buyer))} 的點數扣 ${row.cost} 點。</p>`,
    "同意並確認",async ()=>{
      await updateExchange(row.id,"accept",row);
      finish("已確認，待辦已加入「一起」。");
    });
}
async function updateExchange(id,action,value){
  await gameUpdate((state,{me,day})=>{
    const row=find(state.exchanges,id);
    if(!row || (row.owner!==me && row.buyer!==me)) throw Error("找不到這筆兌換。");
    if(row.status==="pending" && row.turn===me && action==="accept"){
      if(["title","text","day","cost"].some(key=>row[key]!==value[key])) throw Error("提案內容已更新，請重新查看。");
      acceptExchange(state,row,day);
    }else if(row.status==="pending" && row.turn===me && action==="decline") row.status="declined";
    else if(row.status==="pending" && row.turn!==me && action==="withdraw") row.status="cancelled";
    else if(row.status==="accepted" && row.buyer===me && action==="done") row.status="done";
    else if(row.status==="accepted" && action==="date") row.day=value;
    else if(row.status==="accepted" && action==="refund"){
      changePoints(state,row.buyer,row.cost,"退回 · "+row.title,day);
      row.status="cancelled";
    }else throw Error("這筆兌換的狀態已更新。");
  });
}
function gameHistory(){
  const history=gameState.history.filter(row=>row.player===accountId).reverse();
  show("點數明細",`<p class="game-points">${gameBalance(gameState,accountId)} 點</p>
    <div class="stack">${history.map(row=>`<div class="item history-item"><span>${escape(row.title)}<br><span class="quiet">${escape(row.day)}</span></span><strong>${row.delta>0?"+":""}${row.delta}</strong></div>`).join("")||empty("完成任務後，點數會記在這裡。")}</div>`);
}
function confirmGame(label,text,confirm,change){
  form(label,`<p class="quiet">${escape(text)}</p>`,confirm,async ()=>{
    await change();
    finish("已更新。");
  });
}
async function gameAction(key,id){
  switch(key){
    case "game-open":gamePage="draw";go("game");break;
    case "game-page":gamePage=id;render();break;
    case "game-reveal":revealMission(Number(id));break;
    case "game-claim":await claimMission(Number(id));break;
    case "game-drop":dropForm();break;
    case "game-drop-remove":
      confirmGame("收回投卡","這張卡會從對方的待抽清單移除。","確認收回",()=>gameUpdate((state,{me,day})=>{
        const drop=find(state.drops,id);
        if(!drop || drop.from!==me || drop.day<=day) throw Error("這張卡已進入今日牌組。");
        state.drops=state.drops.filter(row=>row.id!==id);
      }));
      break;
    case "game-mission-accept":case "game-mission-decline":case "game-mission-cancel":case "game-mission-done":
      await changeMission(id,key.slice("game-mission-".length));break;
    case "game-memory":{
      const row=find(gameState.missions,id);
      if(row?.status==="done" && taskIsMember(row,accountId)) composeMemory({title:row.title});
      break;
    }
    case "game-offer":offerForm();break;
    case "game-offer-remove":
      confirmGame("下架兌換券","已送出的兌換會保留。","確認下架",()=>gameUpdate((state,{me})=>{
        const offer=find(state.offers,id);
        if(!offer || offer.owner!==me) throw Error("這張券已更新。");
        state.offers=state.offers.filter(row=>row.id!==id);
      }));
      break;
    case "game-use":{const row=find(gameState.offers,id);if(row && row.owner!==accountId) useOffer(row);break;}
    case "game-wish":wishForm();break;
    case "game-counter":{const row=find(gameState.exchanges,id);if(row) wishForm(row);break;}
    case "game-exchange-accept":{const row=find(gameState.exchanges,id);if(row) reviewExchange(row);break;}
    case "game-exchange-decline":case "game-exchange-withdraw":case "game-exchange-done":
      await updateExchange(id,key.slice("game-exchange-".length));tell("已更新兌換紀錄。");break;
    case "game-date":{
      const row=find(gameState.exchanges,id);
      if(row) form("安排兌換日期",field("日期","day",row.day,"type='date' required"),"儲存日期",async data=>{
        await updateExchange(id,"date",required(data,"day"));finish("日期已更新。");
      });
      break;
    }
    case "game-refund":
      confirmGame("取消這筆兌換？","點數會退回給兌換的人，待辦也會移除。","取消並退點",()=>updateExchange(id,"refund"));break;
    case "game-history":gameHistory();break;
  }
}
if(firebaseConfig){
  startCloud().catch(error=>{loading=false;problem="無法啟動登入服務。請確認 Firebase 網頁設定與網路連線。";render();console.error(error);});
}else{
  store=demoStore;
  demoSync();
}
</script>
</body>
