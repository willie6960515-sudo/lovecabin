*{box-sizing:border-box}
body{
  margin:0;min-height:100dvh;color:var(--ink);
  background:radial-gradient(ellipse at 90% 1%,#ffe7a88c,transparent 35rem),
    radial-gradient(ellipse at 0 42%,#fffdf8,transparent 38rem),var(--paper);
  font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}
:where(button,input,textarea,select,summary):focus-visible{outline:3px solid var(--focus);outline-offset:3px}
main:focus{outline:none}
[hidden]{display:none!important}
.shell{max-width:1024px;margin:auto;padding:0 30px 108px}
header{min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--serif);font-weight:800;font-size:24px;letter-spacing:.035em}
.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:16px;background:linear-gradient(155deg,#fff4c5,#f3c562);color:var(--accent);border:1px solid #e5b855;box-shadow:0 3px 9px #a36a171c;font-family:system-ui;font-size:25px}
.status{padding:8px 14px;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid var(--line);border-radius:100px;background:var(--white);color:var(--accent);font-size:14px;font-weight:700;min-height:44px}
.hero{min-height:282px;display:grid;align-content:center;position:relative;isolation:isolate;overflow:hidden;border:1px solid #efd18b;border-radius:30px;padding:36px 42px;color:#402912;background:#ffe9aa;box-shadow:var(--shade)}
.hero::before{
  content:"";position:absolute;z-index:-1;inset:0;
  background-image:linear-gradient(90deg,#fff4d9 4%,#fff2d7ed 30%,#ffefc49c 52%,#fff6d516 76%),
    var(--hero-art,radial-gradient(ellipse at 85% 55%,#eab85d,#ffe4a1 70%));
  background-position:center,center 55%;background-size:cover;
}
.hero-copy{max-width:65%;overflow-wrap:anywhere}
.hero-date{display:flex;align-items:center;gap:8px;color:#6b441d;font-size:13px;letter-spacing:.11em;font-weight:700;font-variant-numeric:tabular-nums}
.hero-date span{font-size:17px;letter-spacing:0;color:#9e631c}
.hero h1{font:800 clamp(34px,5vw,56px)/1.17 var(--serif);margin:12px 0;letter-spacing:-.01em;text-wrap:balance}

const rowsOf = (rows,kind) => order(rows.filter(row=>row.kind===kind));
const find = (rows,id) => rows.find(row=>row.id===id);
const currentShuffle = () => personal.find(row=>row.kind==="shuffle" && row.date===today());
function dailyTopics(){
  const date=today();
  const serial=Math.floor(Date.parse(date)/86400000);
  const offset=currentShuffle()?.count || 0;
  const cards=categories.map((category,index)=>({
    name:category.name,
    text:category.questions[(serial+(index+1)*5+offset*5)%category.questions.length]
  }));
  const custom=shared.filter(row=>row.kind==="question" && row.date<date).sort((a,b)=>a.id.localeCompare(b.id));
  if(custom.length && (serial+offset)%3===0){
    const row=custom[Math.floor((serial+offset)/3)%custom.length];
    cards[1]={name:"我們的題庫",text:row.text};
  }
  return cards;
}
function tell(text){
  const box=$("#toast");
  box.textContent=text;
  box.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>box.hidden=true,3400);
}
function show(heading,html){
  $("#dialog-title").textContent=heading;
  content.innerHTML=html;
  if(!dialog.open) dialog.showModal();
}
function form(heading,html,label,submit){
  show(heading,`<form>${html}<p class="error" role="alert"></p><button class="btn primary" type="submit">${label}</button></form>`);
  wireForm(content.querySelector("form"),submit);
}
function wireForm(element,submit){
  element.addEventListener("submit",async event=>{
    event.preventDefault();
    const trigger=element.querySelector("[type=submit]");
    if(trigger.disabled) return;
    trigger.disabled=true;
    const error=element.querySelector(".error");
    error.textContent="";
    try{await submit(new FormData(element));}
    catch(failure){error.textContent=explain(failure);}
    finally{trigger.disabled=false;}
  });
}
function explain(error){
  const messages={
    "permission-denied":"目前的帳號無法操作這筆資料，請確認配對狀態及資料庫規則。",
    "auth/invalid-credential":"電子郵件或密碼有誤。",
    "auth/operation-not-allowed":"Firebase 尚未啟用電子郵件／密碼登入。請到 Authentication 的登入方式啟用。",
    "auth/configuration-not-found":"Firebase 尚未完成 Authentication 設定。請先在控制台啟用電子郵件／密碼登入。",
    "auth/email-already-in-use":"這個電子郵件已註冊，請改用登入。",
    "auth/weak-password":"請使用至少 8 個字元的密碼。",
    "auth/network-request-failed":"無法連上登入服務，請確認網路。",
    "auth/too-many-requests":"嘗試次數過多，請稍後再試。"
  };
  return messages[error?.code] || (error?.code?"操作失敗，請確認網路與小屋設定後再試。":error?.message) || "操作失敗，請再試一次。";
}
const textField=(data,key)=>String(data.get(key)||"").trim();
function required(data,key){
  const value=textField(data,key);
  if(!value) throw Error("請先填寫內容。");
  return value;
}
function create(scope,kind,data,id=uid()){
  if(scope==="shared" && !available()) throw Error("請先完成雙人配對。");
  return store.change(scope,id,{kind,author:accountId,name,created:Date.now(),date:today(),...data});
}
function finish(message){
  dialog.close();
  tell(message);
}
function sharedGuard(){
  if(available()) return true;
  pairView();
  return false;
}
function availableCategories(){
  const custom = shared.filter(row=>row.kind==="expenseCat").map(row=>row.title);
  return [...new Set([...expenseCategories,...custom].filter(Boolean))];
}
function expenseCategory(row, choices){
  return row.category || (choices.includes(row.album)?row.album:uncategorized);
}
function people(){
  const otherId = firebaseConfig
    ? (room?.owner===accountId?room.partner:room?.owner)
    : (accountId==="first"?"second":"first");
  const member = (id,person,role) => ({id,name:person,label:`${person}（${role}）`});
  return [member(accountId,name,"你"),member(otherId,otherName,"對方")];
}
function expensePayer(row,members){
  if(row.payerId) return members.find(member=>member.id===row.payerId);
  const matches = members.filter(member=>member.name===row.payer);
  return matches.length===1 ? matches[0] : undefined;
}
const cents = amount => Math.round(amount*100);
const centsLabel = amount => money(amount/100);
function monthLabel(month){
  const [year,number] = month.split("-");
  return `${year} 年 ${Number(number)} 月`;
}
function offsetMonth(month,offset){
  const [year,number] = month.split("-").map(Number);
  const serial = Math.min(9999*12+11,Math.max(12,year*12+number-1+offset));
  return `${String(Math.floor(serial/12)).padStart(4,"0")}-${String(serial%12+1).padStart(2,"0")}`;
}
function item(row,html,actions=[]){
  return `<article class="item">${html}${actions.length?`<div class="item-actions">${actions.join("")}</div>`:""}</article>`;
}
function entry(row){
  const date=escape(row.date||"");
  const label=escape(row.title||"");
  const info=escape(displayName(row));
  const body=row.text?`<p class="body-text">${escape(row.text)}</p>`:"";
  const remove=owns(row)?button("刪除","remove-shared:"+row.id,"danger"):"";
  if(row.kind==="message") return item(row,`<p class="minor">${info}${owns(row)?"送出":"留給你"} · ${date}</p><h3>${label}</h3>${body}`,[!owns(row)?button("回覆","reply:"+row.id):"",remove].filter(Boolean));
  if(row.kind==="task") return item(row,`<p class="minor">${row.invite?"聊天邀請":"共同待辦"} · ${row.done?"已完成":row.status==="later"?"改天再聊":row.status==="accepted"?"已答應":row.invite?"等回覆":"待完成"}${date?" · "+date:""}</p><h3>${label}</h3>${body}${row.assignee?`<p class="minor">負責人 ${escape(row.assignee)}</p>`:""}`,[
    row.invite && !owns(row) && !row.done?button("我也想聊","accept:"+row.id)+button("改天再聊","later:"+row.id):"",
    !row.invite || row.status==="accepted"?button(row.done?"重新開啟":"標成完成","toggle:"+row.id):"",remove
  ].filter(Boolean));
  if(row.kind==="expense"){
    const category = expenseCategory(row,availableCategories());
    const group = row.album && row.album!==category ? " · "+escape(row.album) : "";
    const payer = expensePayer(row,people())?.label || row.payer || "未辨識";
    return item(row,`<p class="minor">${date} · ${escape(category)}${group}</p><h3>${label}　${escape(centsLabel(cents(row.amount)))}</h3><p class="minor">${escape(payer)}付款</p>${body}`,[owns(row)?button("修改","expense-edit:"+row.id):"",remove].filter(Boolean));
  }
  return item(row,`${isPhoto(row.photo)?`<img class="item-photo" src="${row.photo}" alt="${label}" loading="lazy">`:""}<p class="minor">${date} · ${escape(row.album||"日常")} · ${info}新增</p><h3>${label}</h3>${body}`,[button("補一句","memory-note:"+row.id),remove].filter(Boolean));
}
function home(){
  const incoming=rowsOf(shared,"message").filter(row=>!owns(row) && !row.ref?.startsWith("memory:"));
  const upcoming=rowsOf(shared,"task").find(row=>!row.done && (!row.invite || !owns(row)));
  const waiting=gameState.missions.filter(row=>row.status==="invited" && row.partner===accountId && row.day===today()).length
    +gameState.exchanges.filter(row=>row.status==="pending" && row.turn===accountId).length;
  return `<div class="hero"><div class="hero-copy"><p class="hero-date"><span aria-hidden="true">✦</span>${escape(today().replaceAll("-"," / "))}</p><h1>${escape(name)}，今天想聊什麼？</h1><p>${available()?`和${escape(otherName)}一起留一點時間給彼此。`:"配對後，就能把今天想聊的題目邀給對方。"}</p></div></div>
    <section class="panel game-banner"><div><h2>今日任務</h2><p class="quiet">${available()?`你有 ${gameBalance(gameState,accountId)} 點${waiting?` · ${waiting} 件等你回覆`:" · 三張卡可以翻"}`:"配對後開啟雙人任務。"}</p></div>${button("去翻卡","game-open","primary")}</section>
    <section><div class="section-top"><h2>今天想聊哪一題？</h2>${button("↻ 換一組","shuffle","link")}</div>
    <div class="cards">${dailyTopics().map((card,index)=>`<button type="button" class="topic" data-action="topic:${index}"><span class="tag">${escape(card.name)}</span><strong>${escape(card.text)}</strong><span class="arrow" aria-hidden="true">↗</span></button>`).join("")}</div></section>
    <section><div class="section-top"><h2>隨手記下</h2></div>${tiles([["✉","留一句給你","message"],["◉","寫進密封罐","jar"],["＋","記一筆支出","expense"],["▧","加一則回憶","memory"]])}</section>
    ${panel("對方留給你的話",incoming.length?incoming.slice(0,2).map(entry).join(""):empty("有新的留言時，會出現在這裡。"),button("看所有留話","messages","link"))}
    ${upcoming?panel("接下來一起做",entry(upcoming)):""}`;
}
function together(){
  const tasks=rowsOf(shared,"task").sort((a,b)=>Number(a.done)-Number(b.done));
  return title("一起","把共同的安排和想聊的話題記在這裡。")
    +(!available()?empty("完成雙人配對後，你們可以共用這裡。")+button("設定配對","pair","primary"):"")
    +panel("共同待辦",tasks.length || acceptedExchanges().length ? tasks.map(entry).join("")+acceptedExchanges().map(exchangeCard).join(""):empty("目前沒有待辦。"),button("＋ 新增待辦","task"))
    +panel("自訂題庫",empty("新增的題目，從明天起有機會出現在你們的每日題卡。")+rowsOf(shared,"question").map(row=>item(row,`<p class="body-text">${escape(row.text)}</p>`,owns(row)?[button("刪除","remove-shared:"+row.id,"danger")]:[])).join(""),button("＋ 加題目","question"));
}
function ledger(){
  const heading = title("帳本","依月份查看兩人各付多少，以及錢花在哪裡。");
  if(!available()) return heading+empty("完成雙人配對後，你們可以共用帳本。")+button("設定配對","pair","primary");
  const all = rowsOf(shared,"expense").sort((a,b)=>b.date.localeCompare(a.date));
  const current = today().slice(0,7);
  const months = [...new Set([selectedMonth,...Array.from({length:12},(_,index)=>offsetMonth(current,-index)),...all.map(row=>row.date.slice(0,7))])].filter(Boolean).sort().reverse();
  const period = all.filter(row=>row.date.slice(0,7)===selectedMonth);
  const members = people();
  const choices = availableCategories();
  const byCategory = new Map();
  const byPayer = new Map();
  let total = 0;
  for(const row of period){
    const amount = cents(row.amount);
    const category = expenseCategory(row,choices);
    const payerId = expensePayer(row,members)?.id || "";
    total += amount;
    byCategory.set(category,(byCategory.get(category)||0)+amount);
    byPayer.set(payerId,(byPayer.get(payerId)||0)+amount);
  }
  const summaryCard = (label,amount,style="") => `<div class="panel ${style}"><p class="minor">${escape(label)}</p><strong>${escape(centsLabel(amount))}</strong></div>`;
  const summary = `<div class="budget-summary">${summaryCard(`合計支出 · ${period.length} 筆`,total,"total")}
    ${members.map(member=>summaryCard(member.label,byPayer.get(member.id)||0)).join("")}
    ${byPayer.has("")?summaryCard("舊紀錄付款人待確認",byPayer.get(""),"unassigned"):""}</div>`;
  const chart = total>0 ? `<div class="panel chart">${[...byCategory].sort((a,b)=>b[1]-a[1]).map(([category,amount])=>{
    const percentage = amount/total*100;
    return `<figure><figcaption><span>${escape(category)}</span><span>${escape(centsLabel(amount))} · ${Number(percentage.toFixed(1))}%</span></figcaption>
      <div class="track" aria-hidden="true"><div class="bar" style="width:${percentage}%"></div></div></figure>`;
  }).join("")}</div>` : empty("這個月還沒有支出可統計。");
  return heading+`<div class="controls">${button("＋ 記一筆","expense","primary")}${button("＋ 新增分類","new-category")}</div>
    <div class="month-control"><button class="btn" type="button" data-action="previous-month" aria-label="上個月">‹</button>
    <select id="book-month" aria-label="帳本月份">${months.map(month=>`<option value="${escape(month)}" ${month===selectedMonth?"selected":""}>${escape(monthLabel(month))}</option>`).join("")}</select>
    <button class="btn" type="button" data-action="next-month" aria-label="下個月">›</button></div>`
    +panel("兩人的付款小計",summary)
    +panel("分類支出",chart)
    +panel("本月明細",period.length?period.map(entry).join(""):empty("可以從一筆日常開銷開始。"));
}
function memories(){
  const records=rowsOf(shared,"memory").sort((a,b)=>b.date.localeCompare(a.date));
  const albums=[...new Set(records.map(row=>row.album||"日常"))];
  return title("回憶","一張照片、一句話，或一次想再去的旅行。")
    +button("＋ 加一則回憶","memory","primary")
    +(albums.length?albums.map(album=>panel(escape(album),records.filter(row=>(row.album||"日常")===album).map(row=>{
      const notes=rowsOf(shared,"message").filter(note=>note.ref==="memory:"+row.id).reverse();
      return entry(row)+notes.map(note=>`<div class="panel"><p class="minor">${escape(displayName(note))}補了一句</p><p class="body-text">${escape(note.text)}</p>${owns(note)?button("刪除","remove-shared:"+note.id,"link"):""}</div>`).join("");
    }).join(""))).join(""):panel("共同相簿",empty("回憶會依你填寫的相簿名稱分組。")));
}

    +panel("留話草稿",drafts.length?drafts.map(row=>item(row,`<h3>${escape(row.title||"未命名草稿")}</h3>`,[button("繼續寫","draft:"+row.id),button("刪除","remove-private:"+row.id,"danger")])).join(""):empty("還沒有草稿。"))
    +panel("收藏的題目",favorites.length?favorites.map(row=>item(row,`<p class="body-text">${escape(row.text)}</p>`,[button("打開題卡","favorite:"+row.id),button("取消收藏","remove-private:"+row.id)])).join(""):empty("遇到想改天再聊的題目，可以先收藏。"))
    +panel("小屋設定",`<div class="panel"><p class="quiet">${firebaseConfig?"可以匯出你的私人資料和目前可讀取的共同資料。":"這裡使用本機試用資料。同一瀏覽器可切換兩個示範身分。請用範例內容試玩。"} </p><div class="controls">${button(firebaseConfig?"配對狀態":"切換示範身分","pair")}${button("匯出資料","export")}${firebaseConfig?button("登出","logout"):button("匯入試用備份","import")}</div></div>`);

function messages(){
  const rows=rowsOf(shared,"message").filter(row=>!row.ref?.startsWith("memory:"));
  return title("留一句給你","你和對方送出的話都在這裡。")+button("＋ 寫給對方","message","primary")
    +panel("你們的留話",rows.length?rows.map(entry).join(""):empty("可以從一句短短的問候開始。"));

function render(){
  $("#nav").hidden=!accountId;
  $("#account").hidden=!accountId;
  $("#account").textContent=firebaseConfig?name:"試用 · "+name+" ⇄";
  document.querySelectorAll("[data-tab]").forEach(btn=>{
    if(btn.dataset.tab===(tab==="messages"?"home":tab)) btn.setAttribute("aria-current","page");
    else btn.removeAttribute("aria-current");
  });
  if(loading) {view.innerHTML=empty("正在打開小屋…");return;}
  if(!accountId) {renderGate();return;}
  const page={home,together,game:gameView,ledger,memories,mine,messages}[tab] || home;
  view.innerHTML=(problem?`<p class="panel error" role="alert">${escape(problem)}</p>`:"")+page();
}
function go(next){
  tab=next;
  render();
  window.scrollTo(0,0);
  view.focus({preventScroll:true});
}

function topicView(card){
  show(card.name,`<div class="form-field"><label for="topic-text">這次想聊的問題</label><textarea id="topic-text" maxlength="120" required>${escape(card.text)}</textarea><p class="quiet">可以先改成你們平常會說的話。</p></div>
    <div class="controls">${button("現在一起聊","talk-now","primary")}${button("邀你晚點聊","invite-topic")}${button("先寫下我的答案","answer-topic")}<button id="topic-favorite" class="btn" type="button">收藏題目</button></div>`);
  selectedTopic=card;
  const input = $("#topic-text");
  const favoriteButton = $("#topic-favorite");
  function updateFavorite(){
    const favorite = personal.find(row=>row.kind==="favorite" && row.text===input.value.trim());
    favoriteButton.dataset.action = favorite ? "remove-private:"+favorite.id : "save-topic";
    favoriteButton.textContent = favorite ? "取消收藏" : "收藏題目";
  }
  input.addEventListener("input",updateFavorite);

let selectedTopic=null;
function readTopic(){
  const input = content.querySelector("#topic-text");
  if(!input) return selectedTopic;
  const text = input.value.trim();
  input.setCustomValidity(text?"":"請輸入想聊的問題。");
  if(!input.reportValidity()) return null;
  selectedTopic={...selectedTopic,text};
  return selectedTopic;
}
function composeJar(row){
  form(row?"補寫這一罐":"寫進密封罐",
    `<p class="quiet">封存後只有你能從這裡開罐。</p>${field("標題（選填）","title",row?.title,"maxlength='120'")}${area("想寫下的話","text",row?.text)}`,
    "封存",async data=>{
      const values={title:textField(data,"title"),text:required(data,"text")};
      if(row) await store.change("private",row.id,values);
      else await create("private","jar",values);
      finish("已封存。");
    });
}
function openJar(row){
  show(row.title||"未命名的一罐",`<p class="quote">${escape(row.text)}</p><div class="controls">${button("蓋回去","close","primary")}${button("補寫","edit-jar:"+row.id)}${button("分享一份","share-jar:"+row.id)}${button("刪除","remove-private:"+row.id,"danger")}</div>`);
}
function previewMessage(values,draftId,share){
  show("送出前預覽",`<p class="quiet">以下內容會送給 ${escape(otherName)}。</p><h3>${escape(values.title)}</h3><p class="quote">${escape(values.text)}</p><form><p class="error" role="alert"></p><div class="controls"><button class="btn primary" type="submit">確認送出</button>${button("回去修改","back-message")}</div></form>`);
  messagePreview={values,draftId,share};

    await create("shared","message",values);
    if(draftId){
      try{await store.change("private",draftId,null);}
      catch(error){finish("已送出，原草稿仍在。");return;}
    }
    finish("已送給對方。");
  });
}
let messagePreview=null;
function composeMessage(initial={},draftId="",share=false){
  show(share?"分享密封罐的副本":"留一句給你",`<form>
    ${share?`<p class="quiet">可以刪減或改寫。罐裡的原文仍留給你。</p>`:""}
    ${field("標題（選填）","title",initial.title,"maxlength='120'")}${area("想說的話","text",initial.text)}

async function compress(file){
  if(!file?.size) return "";
  if(file.size>20*1024*1024) throw Error("請選擇 20 MB 以內的照片。");
  const url=URL.createObjectURL(file);
  try{
    const image=new Image();
    image.src=url;
    await image.decode();
    const canvas=document.createElement("canvas");
    const ctx=canvas.getContext("2d");
    for(const size of [1000,780,570,400]){
      const scale=Math.min(1,size/Math.max(image.width,image.height));
      canvas.width=Math.max(1,Math.round(image.width*scale));
      canvas.height=Math.max(1,Math.round(image.height*scale));
      ctx.fillStyle="#fff";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(image,0,0,canvas.width,canvas.height);
      const encoded=canvas.toDataURL("image/jpeg",.74);
      if(isPhoto(encoded)) return encoded;
    }
    throw Error("這張照片無法壓縮到適用大小。");
  }catch(error){
    throw Error("無法加入這張照片。請試試 JPG、PNG 或 WebP。");
  }finally{URL.revokeObjectURL(url);}
}

function importDemo(){

    const file=data.get("backup");
    if(file.size>8*1024*1024) throw Error("備份檔過大。");
    let backup;
    try{backup=JSON.parse(await file.text());}catch(error){throw Error("這份備份不是有效的 JSON。");}
    const valid=(rows,kinds)=>Array.isArray(rows) && rows.every(row=>row && /^[a-f0-9]{32}$/.test(row.id) &&
      kinds.includes(row.kind) && Object.hasOwn(demoNames,row.author) && Number.isFinite(row.created) &&
      typeof row.date==="string" && /^(?:\d{4}-\d{2}-\d{2})?$/.test(row.date) &&
      ["title","text","name","ref","album","payer","payerId","category","assignee","status"].every(key=>row[key]===undefined || typeof row[key]==="string") &&
      (!row.photo || isPhoto(row.photo)) &&
      (row.kind!=="shuffle" || (Number.isInteger(row.count) && row.count>=1 && row.count<=3)) &&
      (row.kind!=="expenseCat" || (typeof row.title==="string" && row.title.length>=1 && row.title.length<=24)) &&
      (row.kind!=="expense" || (Number.isFinite(row.amount) && row.amount>0)));
    if(backup?.version!==1 || backup.mode!=="demo" || backup.account!==accountId || !valid(backup.shared,sharedKinds) ||
       !valid(backup.personal,privateKinds) || backup.personal.some(row=>row.author!==accountId)) throw Error("請選擇同一個試用身分匯出的備份。");
    const merge=(current,added)=>{
      const records=new Map(current.map(row=>[row.id,row]));
      for(const row of added) if(!records.has(row.id)) records.set(row.id,row);
      return [...records.values()];
    };
    const next=structuredClone(demoData);
    next.shared=merge(next.shared,backup.shared);
    next.private[accountId]=merge(next.private[accountId],backup.personal);
    if(backup.game && !validGame(backup.game)) throw Error("備份中的任務資料格式有誤。");
    if(!next.game?.revision && backup.game?.revision) next.game=backup.game;
    try{localStorage.setItem(demoKey,JSON.stringify(next));}
    catch(error){throw Error("試用備份超出瀏覽器可儲存的空間。");}
    demoData=next;
    demoSync();
    finish("已匯入試用備份。");
  });
}

async function startCloud(){
  const base="https://www.gstatic.com/firebasejs/13.2.0/";
  const [appModule,authModule,dbModule]=await Promise.all([
    import(base+"firebase-app.js"),import(base+"firebase-auth.js"),import(base+"firebase-firestore.js")
  ]);
  const app=appModule.initializeApp(firebaseConfig);
  const auth=authModule.getAuth(app);
  const db=dbModule.getFirestore(app);
  const {doc,collection,writeBatch,runTransaction,setDoc,updateDoc,deleteDoc,onSnapshot}=dbModule;
  const root="twoHomeV1";
  const userRef=who=>doc(db,root+"Users",who);
  const roomRef=code=>doc(db,root+"Rooms",code);
  const gameRef=code=>doc(roomRef(code),"game","state");
  let unsubscribers=[];
  let unsubRoom=[];
  let roomId="";
  function releaseRoom(){
    for(const unsubscribe of unsubRoom) unsubscribe();
    unsubRoom=[];
  }
  function syncFailure(error){problem=explain(error);loading=false;render();}
  function watchRoom(code){
    if(code===roomId) return;
    releaseRoom();
    roomId=code;
    room=null;
    shared=[];
    gameState=emptyGame();
    if(!code) return;
    let recordsWatching=false;
    unsubRoom.push(onSnapshot(roomRef(code),snapshot=>{
      room=snapshot.exists()?{id:code,...snapshot.data()}:null;
      if(room){
        otherName=(room.owner===accountId?room.partnerName:room.ownerName)||"對方";
        if(room.partner && !recordsWatching){
          recordsWatching=true;
          unsubRoom.push(onSnapshot(collection(roomRef(code),"shared"),result=>{
            shared=result.docs.map(entry=>({id:entry.id,...entry.data()}));render();
          },syncFailure));
          unsubRoom.push(onSnapshot(gameRef(code),result=>{
            const state=result.data();
            if(state && !validGame(state)){syncFailure(Error("任務資料無法讀取，請先保留備份。"));return;}
            if(state && state.revision>=gameState.revision) gameState=state;
            render();
          },syncFailure));
        }
      }
      render();
    },syncFailure));
  }
  store={
    login:(email,password)=>authModule.signInWithEmailAndPassword(auth,email,password),
    register:async(email,password,nickname)=>{
      const {user}=await authModule.createUserWithEmailAndPassword(auth,email,password);
      await authModule.updateProfile(user,{displayName:nickname});
      name=nickname;render();
    },
    reset:email=>authModule.sendPasswordResetEmail(auth,email),
    logout:()=>authModule.signOut(auth),
    change:async(scope,id,patch)=>{
      const ref=scope==="private"?doc(userRef(accountId),"private",id):doc(roomRef(room.id),"shared",id);
      if(!patch) await deleteDoc(ref);
      else if(patch.kind) await setDoc(ref,patch);
      else await updateDoc(ref,patch);
    },
    gameChange:async mutate=>{
      const code=room.id;
      const player=accountId;
      const ref=gameRef(code);
      const saved=await runTransaction(db,async transaction=>{
        const snapshot=await transaction.get(ref);
        const next=applyGame(snapshot.data(),mutate);
        transaction.set(ref,next);
        return next;
      });
      if(room?.id===code && accountId===player && saved.revision>=gameState.revision){gameState=saved;render();}
    },
    createRoom:async()=>{
      const code=uid();
      const ownerName=name;
      const batch=writeBatch(db);
      batch.set(roomRef(code),{owner:accountId,ownerName,partner:"",partnerName:""});
      batch.set(userRef(accountId),{room:code});
      await batch.commit();
      if(room?.id!==code) room={id:code,owner:accountId,ownerName,partner:"",partnerName:""};
    },
    joinRoom:async code=>{
      await runTransaction(db,async transaction=>{
        const existing=await transaction.get(userRef(accountId));
        if(existing.exists()) throw Error("這個帳號已經加入一間小屋。");
        let invite;
        try{invite=await transaction.get(roomRef(code));}
        catch(error){
          if(error.code==="permission-denied") throw Error("這組邀請碼不存在或已用過。");
          throw error;
        }
        if(!invite.exists() || invite.data().partner || invite.data().owner===accountId) throw Error("這組邀請碼無法使用。");
        transaction.update(roomRef(code),{partner:accountId,partnerName:name});
        transaction.set(userRef(accountId),{room:code});
      });
    }
  };
  cloudReady=true;
  authModule.onAuthStateChanged(auth,user=>{
    for(const unsubscribe of unsubscribers) unsubscribe();
    unsubscribers=[];
    releaseRoom();
    roomId="";
    room=null;
    shared=[];
    personal=[];
    gameState=emptyGame();
    problem="";
    tab="home";
    gamePage="draw";
    selectedMonth=today().slice(0,7);
    accountId=user?.uid||"";
    name=user?.displayName||"我";
    otherName="對方";
    loading=false;
    if(user){
      unsubscribers.push(onSnapshot(userRef(user.uid),snapshot=>watchRoom(snapshot.data()?.room||""),syncFailure));
      unsubscribers.push(onSnapshot(collection(userRef(user.uid),"private"),snapshot=>{
        personal=snapshot.docs.map(entry=>({id:entry.id,...entry.data()}));render();
      },syncFailure));
    }
    render();
  },syncFailure);
}

function emptyGame(){
  return {revision:0,wallets:{},drops:[],missions:[],offers:[],exchanges:[],history:[]};
}
function validGame(value){
  return value && Number.isSafeInteger(value.revision) && value.revision>=0 &&
    value.wallets && typeof value.wallets==="object" && !Array.isArray(value.wallets) &&
    Object.entries(value.wallets).length<=2 && Object.values(value.wallets).every(points=>Number.isSafeInteger(points) && points>=0 && points<=1000000) &&
    gameList(value.drops,30,row=>gameId(row.id) && textFits(row.from,128) && textFits(row.to,128) && validDay(row.day) &&
      taskFields(row) && textFits(row.time,24) && textFits(row.place,24) && textFits(row.budget,24)) &&
    gameList(value.missions,72,row=>gameId(row.id) && textFits(row.owner,128) && textFits(row.partner,128) && validDay(row.day) &&
      taskFields(row) && missionStatuses.includes(row.status) && gameList(row.votes,2,vote=>textFits(vote,128)) &&
      (row.finished===undefined || validDay(row.finished))) &&
    gameList(value.offers,24,row=>gameId(row.id) && textFits(row.owner,128) && textFits(row.title,80) && textFits(row.text,360) &&
      gameCost(row.cost) && typeof row.instant==="boolean") &&
    gameList(value.exchanges,64,row=>gameId(row.id) && textFits(row.owner,128) && textFits(row.buyer,128) &&
      textFits(row.turn,128) && textFits(row.title,80) && textFits(row.text,360) && gameDate(row.day) &&
      exchangeStatuses.includes(row.status) && gameCost(row.cost) && typeof row.wish==="boolean") &&
    gameList(value.history,64,row=>textFits(row.player,128) && textFits(row.title,90) && validDay(row.day) &&
      Number.isSafeInteger(row.delta) && row.delta!==0 && Math.abs(row.delta)<=12);
}
function shiftDay(day,delta){
  const date=new Date(Date.parse(day)+delta*86400000);
  return date.toISOString().slice(0,10);
}
const gameBalance = (state,player) => Object.hasOwn(state.wallets,player)?state.wallets[player]:0;
function applyGame(previous,mutate){
  if(previous && !validGame(previous)) throw Error("任務資料無法讀取，請先保留備份。");
  const state=previous?structuredClone(previous):emptyGame();
  const day=today();
  state.drops=state.drops.filter(row=>row.day>=day);
  state.missions=state.missions.filter(row=>row.day>=shiftDay(day,-30) && !["declined","cancelled"].includes(row.status));
  mutate(state);
  state.history=state.history.slice(-64);
  while(state.exchanges.length>64){
    const old=state.exchanges.findIndex(row=>!["pending","accepted"].includes(row.status));
    if(old<0) throw Error("請先處理一筆未完成的兌換。");
    state.exchanges.splice(old,1);
  }
  state.revision+=1;
  if(!validGame(state)) throw Error("這筆任務資料超出可儲存的範圍。");
  return state;
}
function gameContext(){
  if(!available()) throw Error("請先完成雙人配對。");
  return {me:accountId,other:people()[1].id,day:today(),seed:room.id||"demo"};

function gameUpdate(mutate){
  const context=gameContext();
  return store.gameChange(state=>mutate(state,context));
}
function changePoints(state,player,delta,label,day){
  const total=gameBalance(state,player)+delta;
  if(total<0) throw Error("目前的點數不夠。");
  state.wallets[player]=total;
  state.history.push({player,delta,title:label,day});
}
function gameHash(text){
  let hash=2166136261;
  for(const char of text) hash=Math.imul(hash ^ char.codePointAt(0),16777619);
  return hash>>>0;
}
function draws(state,{seed,me,day}){
  const serial=Math.floor(Date.parse(day)/86400000);
  const cards=missionDecks.map(deck=>{
    const sorted=[...deck.cards].sort((a,b)=>gameHash(seed+a[0])-gameHash(seed+b[0]));
    const [title,text,time,place,budget]=sorted[(serial%sorted.length+sorted.length)%sorted.length];
    return {title,text,time,place,budget,label:deck.label,points:deck.points,duo:deck.duo};
  });
  const hidden=state.drops.find(row=>row.to===me && row.day===day);
  if(hidden) cards[1]={...hidden,label:"驚喜卡",custom:true};
  return cards;
}
const taskIsMember = (row,player) => row.owner===player || row.partner===player;
function claimedFor(state,player,day){
  return state.missions.some(row=>row.day===day &&
    ((row.status==="invited" && row.owner===player) || (["active","done"].includes(row.status) && taskIsMember(row,player))));
}
function missionOpen(row,day){
  return (row.status==="invited" && row.day===day) ||
    (row.status==="active" && day<=shiftDay(row.day,row.duo?7:0));
}

function missionCard(row){
  const mine=row.owner===accountId;
  const actions=[];
  let status="進行中";
  if(row.status==="invited"){
    status=mine?"等對方回覆":"對方邀你一起";
    if(!mine) actions.push(button("我也想玩","game-mission-accept:"+row.id,"primary"),button("今天先跳過","game-mission-decline:"+row.id));
  }
  if(row.status==="active"){
    if(row.votes.includes(accountId)) status="你已完成 · 等對方確認";
    else actions.push(button(row.duo?"我完成了":"完成並領分","game-mission-done:"+row.id,"primary"));
  }
  if(row.status==="done"){
    status="已完成 · +"+row.points+" 點";
    actions.push(button("存成回憶","game-memory:"+row.id));
  }
  else if((mine || row.status==="active") && !row.votes.length) actions.push(button("放回任務","game-mission-cancel:"+row.id));
  const deadline=row.duo && row.status==="active"?" · "+shiftDay(row.day,7)+" 前":"";
  return item(row,`<p class="minor">${status}${deadline}</p><h3>${escape(row.title)}</h3><p class="body-text">${escape(row.text)}</p>`,actions);
}

  revealedDraw={index,day:context.day,title:card.title};

let revealedDraw;
async function claimMission(index){
  const id=uid();
  const revealed=revealedDraw;
  await gameUpdate((state,context)=>{
    const card=draws(state,context)[index];
    if(!card || revealed?.index!==index || revealed.day!==context.day || revealed.title!==card.title) throw Error("題卡已刷新，請再翻開一次。");
    if(claimedFor(state,context.me,context.day)) throw Error("今天已經選過任務了。");
    state.missions.push({id,owner:context.me,partner:card.duo?context.other:"",day:context.day,title:card.title,text:card.text,
      points:card.points,duo:card.duo,status:card.duo?"invited":"active",votes:[]});
  });
  finish(index===2?"已邀請對方一起玩。":"已領取任務。");
}
async function changeMission(id,action){
  await gameUpdate((state,context)=>{
    const row=find(state.missions,id);
    const {me,day}=context;
    if(!row || !taskIsMember(row,me) || !missionOpen(row,day)) throw Error("這張任務目前已結束。");
    if(row.status==="invited" && row.partner===me && action==="accept"){
      const matchingInvite=state.missions.find(mission=>mission.owner===me && mission.partner===row.owner &&
        mission.status==="invited" && mission.day===row.day && mission.title===row.title);
      if(matchingInvite) matchingInvite.status="cancelled";
      if(claimedFor(state,me,row.day)) throw Error("你今天已選過任務。");
      row.status="active";
    }else if(row.status==="invited" && row.partner===me && action==="decline"){
      row.status="declined";
    }else if(action==="cancel" && !row.votes.length && (row.owner===me || row.status==="active")){
      row.status="cancelled";
    }else if(action==="done" && row.status==="active" && !row.votes.includes(me)){
      row.votes.push(me);
      if(!row.duo || row.votes.length===2){
        row.status="done";
        row.finished=day;
        changePoints(state,row.owner,row.points,row.title,day);
        if(row.duo) changePoints(state,row.partner,row.points,row.title,day);
      }
    }else throw Error("這張任務的狀態已更新。");
  });
  const status=find(gameState.missions,id)?.status;
  if(action==="done") tell(status==="done"?"完成任務，點數已入帳。":"已記下，等對方也確認。");
  else tell(action==="accept"?"已接下雙人任務。":"已更新任務。");
}
function dropForm(){
  form("偷偷投一張卡",field("任務名稱","title","","maxlength='80' required")+
    area("任務內容","text","",true,360)+
    field("時間提示","time","10 分鐘","maxlength='24' required")+
    field("地點提示","place","在家／遠端","maxlength='24' required")+
    field("預算提示","budget","免費","maxlength='24' required")+
    `<label>完成點數<select name="points"><option>1</option><option selected>2</option></select></label>`,
    "放進對方的抽卡池",async data=>{
      const id=uid();
      const card={title:required(data,"title"),text:required(data,"text"),time:required(data,"time"),
        place:required(data,"place"),budget:required(data,"budget"),points:Number(data.get("points")),duo:false};
      await gameUpdate((state,{me,other,day})=>{
        const queued=state.drops.filter(row=>row.to===other);
        if(queued.length>=12) throw Error("對方的抽卡池已有 12 張等著出場。");
        let date=shiftDay(day,1);
        while(queued.some(row=>row.day===date)) date=shiftDay(date,1);
        state.drops.push({...card,id,day:date,from:me,to:other});
      });
      finish("已投卡，最快明天就會出現。");
    });
}

  const mine=gameState.offers.filter(row=>row.owner===accountId).reverse();
  return panel("對方的店",offered.length?offered.map(row=>offerCard(row,false)).join(""):empty("對方上架後，這裡就能用點數兌換。"),button("＋ 提願望","game-wish","primary"))
    +panel("我的店",mine.length?mine.map(row=>offerCard(row,true)).join(""):empty("先挑一張你願意替對方做的券。"),button("＋ 上架兌換券","game-offer","primary"));
}
function offerCard(row,mine){
  return item(row,`<p class="minor">${row.cost} 點 · ${row.instant?"可直接兌換":"先詢問時間"}</p><h3>${escape(row.title)}</h3><p class="body-text">${escape(row.text)}</p>`,
    mine?[button("下架","game-offer-remove:"+row.id)]:[button(gameBalance(gameState,accountId)>=row.cost?"使用這張券":"查看兌換券","game-use:"+row.id,"primary")]);
}
function priceField(selected){
  return `<div class="form-field"><label for="coupon-cost">點數</label><select id="coupon-cost" name="cost">${prices.map(price=>`<option value="${price}" ${price===selected?"selected":""}>${price} 點</option>`).join("")}</select></div>`;
}
function offerForm(){
  form("上架兌換券",`<label>選個範例（選填）<select id="coupon-template"><option value="">自己寫</option>
    ${couponPresets.map((preset,index)=>`<option value="${index}">${preset.title}</option>`).join("")}</select></label>`+
    field("券名","title","","maxlength='80' required")+area("適用內容、時間或預算","text","",true,360)+
    priceField(3)+`<label>兌換方式<select name="instant"><option value="yes">可直接兌換，再約日期</option><option value="no">收到請求時先確認</option></select></label>`,
    "上架給對方",async data=>{
      const id=uid();
      const offer={id,title:required(data,"title"),text:required(data,"text"),cost:Number(data.get("cost")),instant:data.get("instant")==="yes"};
      await gameUpdate((state,{me})=>{
        if(state.offers.filter(row=>row.owner===me).length>=12) throw Error("店裡最多同時上架 12 張券。");
        state.offers.push({...offer,owner:me});
      });
      finish("已上架給對方。");
    });
  $("#coupon-template").addEventListener("change",event=>{
    if(event.target.value==="") return;
    const preset=couponPresets[Number(event.target.value)];
    const controls=event.target.form.elements;
    controls.title.value=preset.title;
    controls.text.value=preset.text;
    controls.cost.value=String(preset.cost);
  });
}
function acceptExchange(state,row,day){
  changePoints(state,row.buyer,-row.cost,row.title,day);
  row.status="accepted";
  row.turn="";
}
function newExchange(state,row){
  if(state.exchanges.filter(value=>value.buyer===row.buyer && ["pending","accepted"].includes(value.status)).length>=8)
    throw Error("請先處理一筆進行中的兌換。");
  state.exchanges.push(row);
}
function useOffer(offer){
  const canPay=gameBalance(gameState,accountId)>=offer.cost;
  const details=`<p class="quote">${escape(offer.text)}</p><p class="quiet">需 ${offer.cost} 點 · 你有 ${gameBalance(gameState,accountId)} 點</p>`;
  if(!canPay){show(offer.title,details+button("好","close"));return;}
  form(offer.title,details+field("希望日期（選填）","day","","type='date'"),offer.instant?"確認兌換":"送出兌換請求",async data=>{
    const id=uid();
    const planned=textField(data,"day");
    await gameUpdate((state,{me,other,day})=>{
      const current=find(state.offers,offer.id);
      if(!current || current.owner!==other) throw Error("這張券已下架。");
      if(gameBalance(state,me)<current.cost) throw Error("目前的點數不夠。");
      const row={id,title:current.title,text:current.text,cost:current.cost,day:planned,owner:other,buyer:me,
        wish:false,status:"pending",turn:other};
      if(current.instant) acceptExchange(state,row,day);
      newExchange(state,row);
    });
    finish(offer.instant?"已兌換，待辦已加入「一起」。":"已送出，等對方確認後扣點。");
  });
}
function wishForm(original){
  form(original?"提出修改":"提出一個願望",field("想和對方做什麼","title",original?.title,"maxlength='80' required")+
    area("細節或預算（選填）","text",original?.text,false,360)+
    field("希望日期（選填）","day",original?.day,"type='date'")+priceField(original?.cost||8),
    original?"送出新版提案":"送出願望",async data=>{
      const id=original?.id||uid();
      const proposal={title:required(data,"title"),text:textField(data,"text"),day:textField(data,"day"),cost:Number(data.get("cost"))};
      await gameUpdate((state,{me,other})=>{
        if(original){
          const row=find(state.exchanges,id);
          if(!row || row.status!=="pending" || row.turn!==me) throw Error("這筆提案已更新。");
          if(row.title!==original.title || row.text!==original.text || row.cost!==original.cost || row.day!==original.day)
            throw Error("提案內容已更新，請重新查看。");
          Object.assign(row,proposal,{turn:other});
        }else{
          newExchange(state,{...proposal,id,owner:other,buyer:me,status:"pending",turn:other,wish:true});
        }
      });
      finish("已送出，等對方回覆。");
    });
}
function acceptedExchanges(){
  return gameState.exchanges.filter(row=>row.status==="accepted").reverse();
}
function exchangePage(){
  const records=[...gameState.exchanges].reverse();
  const pending=records.filter(row=>["pending","accepted"].includes(row.status));
  const closed=records.filter(row=>!["pending","accepted"].includes(row.status));
  return panel("等待回覆或安排",pending.length?pending.map(exchangeCard).join(""):empty("送出的兌換或願望會出現在這裡。"))
    +(closed.length?panel("過去的兌換",closed.map(exchangeCard).join("")):"");
}
function exchangeCard(row){
  const actions=[];
  let status={accepted:"已兌換 · 待完成",done:"已完成",declined:"已婉拒",cancelled:"已取消"}[row.status];
  if(row.status==="pending"){
    status=row.turn===accountId?"等你回覆":"等對方回覆";
    if(row.turn===accountId) actions.push(button("確認兌換","game-exchange-accept:"+row.id,"primary"),
      button("改時間或內容","game-counter:"+row.id),button("婉拒","game-exchange-decline:"+row.id));
    else actions.push(button("收回提案","game-exchange-withdraw:"+row.id));
  }
  if(row.status==="accepted"){
    if(row.buyer===accountId) actions.push(button("已完成","game-exchange-done:"+row.id,"primary"));
    actions.push(button(row.day?"改日期":"約日期","game-date:"+row.id),button("取消並退點","game-refund:"+row.id));
  }
  return item(row,`<p class="minor">${row.wish?"願望":"兌換券"} · ${row.cost} 點 · ${status}${row.day?" · "+escape(row.day):""}</p>
    <h3>${escape(row.title)}</h3><p class="minor">${escape(gameMemberName(row.buyer))}兌換 · ${escape(gameMemberName(row.owner))}提供</p>
    ${row.text?`<p class="body-text">${escape(row.text)}</p>`:""}`,actions);
}
function reviewExchange(row){
  form("確認這筆兌換",`<h3>${escape(row.title)}</h3>${row.text?`<p class="quote">${escape(row.text)}</p>`:""}
    <p class="quiet">${row.day?"日期 "+escape(row.day)+" · ":""}確認後會從 ${escape(gameMemberName(row.buyer))} 的點數扣 ${row.cost} 點。</p>`,
    "同意並確認",async ()=>{
      await updateExchange(row.id,"accept",row);
      finish("已確認，待辦已加入「一起」。");
    });
}
async function updateExchange(id,action,value){
  await gameUpdate((state,{me,day})=>{
    const row=find(state.exchanges,id);
    if(!row || (row.owner!==me && row.buyer!==me)) throw Error("找不到這筆兌換。");
    if(row.status==="pending" && row.turn===me && action==="accept"){
      if(["title","text","day","cost"].some(key=>row[key]!==value[key])) throw Error("提案內容已更新，請重新查看。");
      acceptExchange(state,row,day);
    }else if(row.status==="pending" && row.turn===me && action==="decline") row.status="declined";
    else if(row.status==="pending" && row.turn!==me && action==="withdraw") row.status="cancelled";
    else if(row.status==="accepted" && row.buyer===me && action==="done") row.status="done";
    else if(row.status==="accepted" && action==="date") row.day=value;
    else if(row.status==="accepted" && action==="refund"){
      changePoints(state,row.buyer,row.cost,"退回 · "+row.title,day);
      row.status="cancelled";
    }else throw Error("這筆兌換的狀態已更新。");
  });
}
function gameHistory(){
  const history=gameState.history.filter(row=>row.player===accountId).reverse();
  show("點數明細",`<p class="game-points">${gameBalance(gameState,accountId)} 點</p>
    <div class="stack">${history.map(row=>`<div class="item history-item"><span>${escape(row.title)}<br><span class="quiet">${escape(row.day)}</span></span><strong>${row.delta>0?"+":""}${row.delta}</strong></div>`).join("")||empty("完成任務後，點數會記在這裡。")}</div>`);
}
function confirmGame(label,text,confirm,change){
  form(label,`<p class="quiet">${escape(text)}</p>`,confirm,async ()=>{
    await change();
    finish("已更新。");
  });
}
async function gameAction(key,id){
  switch(key){
    case "game-open":gamePage="draw";go("game");break;
    case "game-page":gamePage=id;render();break;
    case "game-reveal":revealMission(Number(id));break;
    case "game-claim":await claimMission(Number(id));break;
    case "game-drop":dropForm();break;
    case "game-drop-remove":
      confirmGame("收回投卡","這張卡會從對方的待抽清單移除。","確認收回",()=>gameUpdate((state,{me,day})=>{
        const drop=find(state.drops,id);
        if(!drop || drop.from!==me || drop.day<=day) throw Error("這張卡已進入今日牌組。");
        state.drops=state.drops.filter(row=>row.id!==id);
      }));
      break;
    case "game-mission-accept":case "game-mission-decline":case "game-mission-cancel":case "game-mission-done":
      await changeMission(id,key.slice("game-mission-".length));break;
    case "game-memory":{
      const row=find(gameState.missions,id);
      if(row?.status==="done" && taskIsMember(row,accountId)) composeMemory({title:row.title});
      break;
    }
    case "game-offer":offerForm();break;
    case "game-offer-remove":
      confirmGame("下架兌換券","已送出的兌換會保留。","確認下架",()=>gameUpdate((state,{me})=>{
        const offer=find(state.offers,id);
        if(!offer || offer.owner!==me) throw Error("這張券已更新。");
        state.offers=state.offers.filter(row=>row.id!==id);
      }));
      break;
    case "game-use":{const row=find(gameState.offers,id);if(row && row.owner!==accountId) useOffer(row);break;}
    case "game-wish":wishForm();break;
    case "game-counter":{const row=find(gameState.exchanges,id);if(row) wishForm(row);break;}
    case "game-exchange-accept":{const row=find(gameState.exchanges,id);if(row) reviewExchange(row);break;}
    case "game-exchange-decline":case "game-exchange-withdraw":case "game-exchange-done":
      await updateExchange(id,key.slice("game-exchange-".length));tell("已更新兌換紀錄。");break;
    case "game-date":{
      const row=find(gameState.exchanges,id);
      if(row) form("安排兌換日期",field("日期","day",row.day,"type='date' required"),"儲存日期",async data=>{
        await updateExchange(id,"date",required(data,"day"));finish("日期已更新。");
      });
      break;
    }
    case "game-refund":
      confirmGame("取消這筆兌換？","點數會退回給兌換的人，待辦也會移除。","取消並退點",()=>updateExchange(id,"refund"));break;
    case "game-history":gameHistory();break;
  }
}
if(firebaseConfig){
  startCloud().catch(error=>{loading=false;problem="無法啟動登入服務。請確認 Firebase 網頁設定與網路連線。";render();console.error(error);});
}else{
  store=demoStore;
  demoSync();
}
</script>
</body>
